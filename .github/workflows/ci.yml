name: CODE.COMMIT CI & Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run Vitest unit & integration tests
        run: npm run test

      - name: Build production Next.js bundle
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/code_commit_db?schema=public"
          NEXT_PUBLIC_SITE_URL: "https://codecommit.sec"
